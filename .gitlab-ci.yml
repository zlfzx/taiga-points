variables:
  APP_PORT: 9001
  TAIGA_BASE_URL: http://taiga.fast-8.com:9000

stages:
  - Deploy Production

deploy to production:
  only:
      refs:
        - main
  stage: Deploy Production
  tags:
    - internal
    - taiga
    - outline
    - betacoreapi
  before_script:
    - sudo cd $PRODUCTION_DIR
  script:
    - whoami
    - sudo su
    - export APP_PORT=$APP_PORT
    - export TAIGA_BASE_URL=$TAIGA_BASE_URL
    - sudo git config --global --add safe.directory $PRODUCTION_DIR
    - sudo git pull http://$GIT_USER:$GIT_PASS@dev.fast-8.com:9874/FAST-8/taiga-points.git main
    - sudo chown gitlab-runner:gitlab-runner $PRODUCTION_DIR -R
    - sudo git branch
    - sudo git status
    - docker-compose up -d --build
    - docker image prune -f -a
    - docker ps

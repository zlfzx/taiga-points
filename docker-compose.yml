version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taiga-points
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./data:/app/data
    environment:
      - APP_PORT=${APP_PORT}
      - TAIGA_BASE_URL=${TAIGA_BASE_URL}
    restart: unless-stopped
